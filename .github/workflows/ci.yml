name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

# 呼び出し時の github.workflow は呼び出し元名になるため、それで直接実行と区別し、
# 呼び出し時は run_id で群を分離して呼び出し元と衝突・相互キャンセルしないようにする。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.workflow == 'CI' && 'direct' || github.run_id }}
  cancel-in-progress: ${{ github.workflow == 'CI' }}

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Run ruff
        run: uv run ruff check .
      - name: Run mypy
        run: uv run mypy

  test-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run pytest -m "not docker and not gui and not pst" --cov=mail_dock

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run non-Docker tests
        run: uv run pytest -m "not docker and not gui and not pst" --cov=mail_dock
      - name: Start Docker integration services
        run: docker compose -f tests/docker/compose.yaml up -d --wait
      - name: Run Docker integration tests
        env:
          MAILDOCK_DOCKER: "1"
        run: uv run pytest -m "docker and not gui and not pst"
      - name: Stop Docker integration services
        if: ${{ always() }}
        run: docker compose -f tests/docker/compose.yaml down -v
