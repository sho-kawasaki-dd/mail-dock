name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  readpst:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install MSYS2 zstd
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: zstd

      - name: Fetch and patch readpst
        shell: pwsh
        run: pwsh -NoProfile -File .\tools\fetch_readpst.ps1 -Msys2Root C:\msys64

      - name: Smoke test bundled converter
        shell: pwsh
        run: |
          $readpst = (Resolve-Path .\vendor\readpst\readpst.exe).Path
          & $readpst -V
          if ($LASTEXITCODE -ne 0) { throw "readpst -V failed with exit code $LASTEXITCODE" }

      - name: Verify GPL release materials and checksums
        shell: pwsh
        run: pwsh -NoProfile -File .\tools\verify_readpst_bundle.ps1 -ZstdPath C:\msys64\usr\bin\zstd.exe

      - name: Prepare readpst corresponding source release asset
        id: package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $archive = Join-Path $env:RUNNER_TEMP "mail-dock-$version-readpst-corresponding-source.zip"
          Copy-Item .\build\sources\msys2\mail-dock-readpst-corresponding-source.zip $archive
          "archive=$archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mail-dock-readpst-corresponding-source-${{ github.ref_name }}
          path: ${{ steps.package.outputs.archive }}

      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.archive }}