services:
  greenmail:
    image: greenmail/standalone:2.1.6
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.imap
        -Dgreenmail.setup.test.imaps
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=testuser:password@localhost
    ports:
      - "3143:3143"
      - "3993:3993"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "echo > /dev/tcp/127.0.0.1/3143 && echo > /dev/tcp/127.0.0.1/3993"
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s

  dovecot:
    image: dovecot/dovecot:2.3.21.1
    hostname: dovecot
    ports:
      - "3144:3144"
      - "3994:3994"
    volumes:
      - ./dovecot/dovecot.conf:/etc/dovecot/dovecot.conf:ro
      - ./dovecot/entrypoint.sh:/usr/local/bin/mail-dock-dovecot-entrypoint.sh:ro
      - dovecot_mail:/var/mail/vmail
    entrypoint: ["/usr/local/bin/mail-dock-dovecot-entrypoint.sh"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          doveadm service status imap-login >/dev/null 2>&1 &&
          bash -c 'echo > /dev/tcp/127.0.0.1/3144 && echo > /dev/tcp/127.0.0.1/3994'
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s

volumes:
  dovecot_mail: