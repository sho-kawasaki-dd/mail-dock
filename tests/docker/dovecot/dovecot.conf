protocols = imap
listen = *

auth_mechanisms = plain login
# Plaintext LOGIN/AUTH is rejected on the non-TLS listener (port 3144) until
# STARTTLS completes. The imaps listener (port 3994) is already TLS-secured
# at the socket level, so this has no effect there and existing tests that
# rely on it are unaffected.
disable_plaintext_auth = yes

mail_location = maildir:~/Maildir

namespace inbox {
  inbox = yes
  prefix =
  separator = .

  mailbox Sent {
    auto = create
    special_use = \Sent
  }
  mailbox Drafts {
    auto = create
    special_use = \Drafts
  }
  mailbox Trash {
    auto = create
    special_use = \Trash
  }
  mailbox "受信トレイ" {
    auto = create
  }
  mailbox "受信トレイ.請求書" {
    auto = create
  }
}

passdb {
  driver = static
  args = password=password
}

userdb {
  driver = static
  args = uid=vmail gid=vmail home=/var/mail/vmail/%u
}

service imap-login {
  inet_listener imap {
    port = 3144
  }
  inet_listener imaps {
    port = 3994
    ssl = yes
  }
}

ssl = yes
ssl_cert = </etc/dovecot/certs/dovecot.crt
ssl_key = </etc/dovecot/certs/dovecot.key