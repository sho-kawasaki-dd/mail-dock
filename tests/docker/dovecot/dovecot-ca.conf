protocols = imap
listen = *

auth_mechanisms = plain login
disable_plaintext_auth = no

mail_location = maildir:~/Maildir

namespace inbox {
  inbox = yes
  prefix =
  separator = .

  mailbox Trash {
    auto = create
    special_use = \Trash
  }
}

passdb {
  driver = static
  args = password=password
}

userdb {
  driver = static
  args = uid=vmail gid=vmail home=/var/mail/vmail/%u
}

service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 3996
    ssl = yes
  }
}

# entrypoint.sh issues this certificate from a throwaway test CA (instead of
# self-signing it) when MAILDOCK_ISSUE_CA_CERT=1, so tests can verify the
# ca_cert_path option without disabling certificate verification.
ssl = yes
ssl_cert = </etc/dovecot/certs/dovecot.crt
ssl_key = </etc/dovecot/certs/dovecot.key
