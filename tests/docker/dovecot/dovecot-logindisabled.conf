protocols = imap
listen = *

auth_mechanisms = plain login
disable_plaintext_auth = no

# Force the LOGINDISABLED capability even though this listener is already
# TLS-secured, so GenericImapFetcher's real SASL PLAIN fallback (F-4/D-6) is
# exercised against a genuine server instead of only the FakeImap unit test.
imap_capability = +LOGINDISABLED

mail_location = maildir:~/Maildir

namespace inbox {
  inbox = yes
  prefix =
  separator = .

  mailbox Trash {
    auto = create
    special_use = \Trash
  }
}

passdb {
  driver = static
  args = password=password
}

userdb {
  driver = static
  args = uid=vmail gid=vmail home=/var/mail/vmail/%u
}

service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 3995
    ssl = yes
  }
}

ssl = yes
ssl_cert = </etc/dovecot/certs/dovecot.crt
ssl_key = </etc/dovecot/certs/dovecot.key
